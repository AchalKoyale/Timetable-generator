{% extends 'base.html' %}
{% block title %}Admin Login - Smart Timetable Generator{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4">
                <div class="bg-white text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 55px; height: 55px;">
                    <i class="fas fa-lock fs-4"></i>
                </div>
                <h4 class="fw-bold mb-1">Admin Portal</h4>
                <p class="small text-white-50 mb-0">Smart Timetable Management System</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="admin" value="admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" value="admin123" required>
                        </div>
                    </div>

                    <div class="alert alert-info py-2 px-3 small border-0 bg-info-subtle text-info-emphasis rounded-3 mb-3">
                        <i class="fas fa-info-circle me-1"></i> Default credentials: <strong>admin</strong> / <strong>admin123</strong>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                        <i class="fas fa-sign-in-alt me-1"></i> Secure Sign In
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 border-0">
                <small class="text-muted">MGM College of Engineering, Nanded &bull; Dept of E&TC</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
